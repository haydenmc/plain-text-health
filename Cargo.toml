[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6.5", features = ["derive", "env"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
