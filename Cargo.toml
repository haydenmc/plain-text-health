[package]
name = "plain-text-health"
version = "0.0.0"
edition = "2024"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"

[[bin]]
name = "pth"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive", "env"] }
comfy-table = "8.0.1"
env_logger = "0.11.11"
log = "0.4.33"
logos = "0.16.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
